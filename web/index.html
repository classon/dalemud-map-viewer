<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DaleMUD Map Viewer</title>
  <script>
    // Set the theme before first paint so the page doesn't flash.
    try {
      const saved = localStorage.getItem('theme');
      const light = saved ? saved === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    } catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div class="app">
    <aside class="pane zones">
      <header class="pane-head">
        <div class="title-row">
          <h1>DaleMUD Maps</h1>
          <button id="theme-toggle" class="theme-toggle" type="button">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
        <input id="zone-filter" type="search" placeholder="Filter zones…" autocomplete="off">
      </header>
      <ul id="zone-list" class="zone-list"></ul>
    </aside>

    <main class="pane map">
      <div id="map-title" class="map-title"></div>
      <div id="viewport" class="viewport"></div>
      <div id="tooltip" class="tooltip" hidden></div>
      <div class="legend">
        <label><input type="checkbox" data-layer="twoway" checked><span class="sw sw-twoway"></span>Two-way</label>
        <label><input type="checkbox" data-layer="oneway" checked><span class="sw sw-oneway"></span>One-way</label>
        <label><input type="checkbox" data-layer="warp" checked><span class="sw sw-warp"></span>Off-grid</label>
        <label><input type="checkbox" data-layer="teleport" checked><span class="sw sw-teleport"></span>Room teleport</label>
        <label><input type="checkbox" data-layer="external" checked><span class="sw sw-external"></span>Other zone</label>
        <label><input type="checkbox" data-layer="doors" checked><span class="sw sw-door"></span>Door <span class="sw sw-secret"></span>Secret</label>
      </div>
      <div class="hint">Drag to rotate · right-drag to pan · scroll to zoom · double-click a room to focus</div>
    </main>

    <aside class="pane details">
      <div id="room-details" class="room-details">
        <p class="muted">Select a room on the map.</p>
      </div>
    </aside>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
